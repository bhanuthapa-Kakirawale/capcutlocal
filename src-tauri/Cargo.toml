[package]
name = "kriti"
version = "0.1.0"
description = "Kriti desktop video editor: application core"
authors = ["Kriti contributors"]
edition = "2024"
rust-version = "1.85"
publish = false

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name, which would
# otherwise collide on Windows (https://github.com/rust-lang/cargo/issues/8519).
name = "kriti_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
blake3 = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[features]
# Tests that spawn real ffmpeg/ffprobe and need it installed (ADR-014). `cargo test` on a
# machine without FFmpeg still runs everything else.
media-tests = []

[target.'cfg(windows)'.dependencies]
# Safe wrapper around Windows Job Objects: an FFmpeg child is assigned to a job with
# KILL_ON_JOB_CLOSE, so a crashed or killed app never leaves an orphaned encoder running
# (docs/MEDIA-PIPELINE.md §1.2). Keeps `unsafe_code = "deny"` (below) honest.
win32job = "2"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
# Recoverable failures must be typed errors (docs/ARCHITECTURE.md §7). Tests are exempt via clippy.toml.
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
codegen-units = 1
# Thin rather than fat LTO: fat LTO's final link ran an 8 GB development machine out of
# memory. Whether distribution builds need fat LTO is measured in P6 (ADR-016).
lto = "thin"
opt-level = 3
strip = true
# `panic` stays at the default (unwind) so worker panics can be caught at job boundaries.
